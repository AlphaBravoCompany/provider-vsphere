apiVersion: hostandclustermanagement.vsphere.alphabravo.io/v1alpha1
kind: DrsVmOverride
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/drsvmoverride
  labels:
    testing.upbound.io/example-name: drs_vm_override
  name: drs-vm-override
spec:
  forProvider:
    computeClusterId: ${data.vsphere_compute_cluster.cluster.id}
    drsEnabled: false
    virtualMachineId: ${vsphere_virtual_machine.vm.id}

---

apiVersion: virtualmachine.vsphere.alphabravo.io/v1alpha1
kind: VirtualMachine
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/drsvmoverride
  labels:
    testing.upbound.io/example-name: vm
  name: vm
spec:
  forProvider:
    datastoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_datastore
    disk:
    - label: disk0
      size: 20
    guestId: otherLinux64Guest
    hostSystemIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_host
    memory: 2048
    name: terraform-test
    networkInterface:
    - networkIdSelector:
        matchLabels:
          testing.upbound.io/example-name: vsphere_network
    numCpus: 2
    resourcePoolIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_compute_cluster
