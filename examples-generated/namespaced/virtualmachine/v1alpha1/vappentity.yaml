apiVersion: virtualmachine.vsphere.m.alphabravo.io/v1alpha1
kind: VappEntity
metadata:
  annotations:
    meta.upbound.io/example-id: virtualmachine/v1alpha1/vappentity
  labels:
    testing.upbound.io/example-name: vapp_entity
  name: vapp-entity
  namespace: crossplane-system
spec:
  forProvider:
    containerId: ${vsphere_vapp_container.vapp_container.id}
    startAction: none
    targetId: ${vsphere_virtual_machine.vm.moid}

---

apiVersion: virtualmachine.vsphere.m.alphabravo.io/v1alpha1
kind: VappContainer
metadata:
  annotations:
    meta.upbound.io/example-id: virtualmachine/v1alpha1/vappentity
  labels:
    testing.upbound.io/example-name: vapp_container
  name: vapp-container
  namespace: crossplane-system
spec:
  forProvider:
    name: terraform-vapp-container-test
    parentResourcePoolId: ${data.vsphere_compute_cluster.compute_cluster.id}

---

apiVersion: virtualmachine.vsphere.m.alphabravo.io/v1alpha1
kind: VirtualMachine
metadata:
  annotations:
    meta.upbound.io/example-id: virtualmachine/v1alpha1/vappentity
  labels:
    testing.upbound.io/example-name: vm
  name: vm
  namespace: crossplane-system
spec:
  forProvider:
    datastoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_datastore
    disk:
    - label: disk0
      size: 1
    guestId: ubuntu64Guest
    memory: 1024
    name: terraform-virtual-machine-test
    networkInterface:
    - networkIdSelector:
        matchLabels:
          testing.upbound.io/example-name: vsphere_network
    numCpus: 2
    resourcePoolIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vapp_container
