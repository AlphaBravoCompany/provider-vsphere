apiVersion: hostandclustermanagement.vsphere.m.alphabravo.io/v1alpha1
kind: Host
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/host
  labels:
    testing.upbound.io/example-name: esx-01
  name: esx-01
  namespace: crossplane-system
spec:
  forProvider:
    datacenter: ${data.vsphere_datacenter.datacenter.id}
    hostname: esxi-01.example.com
    license: 00000-00000-00000-00000-00000
    passwordSecretRef:
      key: example-key
      name: example-secret
    thumbprint: ${data.vsphere_host_thumbprint.thumbprint.id}
    username: root
