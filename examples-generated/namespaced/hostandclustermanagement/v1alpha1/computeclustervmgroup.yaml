apiVersion: hostandclustermanagement.vsphere.m.alphabravo.io/v1alpha1
kind: ComputeClusterVmGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/computeclustervmgroup
  labels:
    testing.upbound.io/example-name: cluster_vm_group
  name: cluster-vm-group
  namespace: crossplane-system
spec:
  forProvider:
    computeClusterId: ${data.vsphere_compute_cluster.cluster.id}
    name: terraform-test-cluster-vm-group
    virtualMachineIds:
    - ${vsphere_virtual_machine.vm.*.id}

---

apiVersion: virtualmachine.vsphere.m.alphabravo.io/v1alpha1
kind: VirtualMachine
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/computeclustervmgroup
  labels:
    testing.upbound.io/example-name: vm
  name: vm
  namespace: crossplane-system
spec:
  forProvider:
    count: 2
    datastoreIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_datastore
    disk:
    - label: disk0
      size: 20
    guestId: otherLinux64Guest
    memory: 2048
    name: terraform-test-${count.index}
    networkInterface:
    - networkIdSelector:
        matchLabels:
          testing.upbound.io/example-name: vsphere_network
    numCpus: 2
    resourcePoolIdSelector:
      matchLabels:
        testing.upbound.io/example-name: vsphere_compute_cluster
