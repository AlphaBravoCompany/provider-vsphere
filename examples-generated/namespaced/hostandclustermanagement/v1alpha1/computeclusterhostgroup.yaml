apiVersion: hostandclustermanagement.vsphere.m.alphabravo.io/v1alpha1
kind: ComputeClusterHostGroup
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/computeclusterhostgroup
  labels:
    testing.upbound.io/example-name: cluster_host_group
  name: cluster-host-group
  namespace: crossplane-system
spec:
  forProvider:
    computeClusterId: ${vsphere_compute_cluster.compute_cluster.id}
    hostSystemIds:
    - ${data.vsphere_host.hosts.*.id}
    name: terraform-test-cluster-host-group

---

apiVersion: hostandclustermanagement.vsphere.m.alphabravo.io/v1alpha1
kind: ComputeCluster
metadata:
  annotations:
    meta.upbound.io/example-id: hostandclustermanagement/v1alpha1/computeclusterhostgroup
  labels:
    testing.upbound.io/example-name: compute_cluster
  name: compute-cluster
  namespace: crossplane-system
spec:
  forProvider:
    datacenterId: ${data.vsphere_datacenter.datacenter.id}
    drsAutomationLevel: fullyAutomated
    drsEnabled: true
    haEnabled: true
    hostSystemIds:
    - ${data.vsphere_host.hosts.*.id}
    name: terraform-compute-cluster-test
