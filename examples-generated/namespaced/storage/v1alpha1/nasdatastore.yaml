apiVersion: storage.vsphere.m.alphabravo.io/v1alpha1
kind: NasDatastore
metadata:
  annotations:
    meta.upbound.io/example-id: storage/v1alpha1/nasdatastore
  labels:
    testing.upbound.io/example-name: datastore
  name: datastore
  namespace: crossplane-system
spec:
  forProvider:
    hostSystemIds:
    - ${data.vsphere_host.hosts.*.id}
    name: terraform-test
    remoteHosts:
    - nfs
    remotePath: /export/terraform-test
    type: NFS
